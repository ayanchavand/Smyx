[package]
name = "myx"
version = "0.2.5"
edition = "2021"
description = "A lean, beautiful terminal Navidrome / OpenSubsonic player"
authors = ["Haseeb Khalid"]
license = "MIT"
repository = "https://github.com/HaseebKhalid1507/Myx"
homepage = "https://github.com/HaseebKhalid1507/Myx"
readme = "README.md"
keywords = ["navidrome", "subsonic", "tui", "music", "player", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]
default-run = "myx"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
image = "0.25"
color-thief = "0.2"

# --- streaming backend (on by default; the single `myx` binary needs it) ---
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
flume = { version = "0.12", optional = true }
rustfft = { version = "6", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
anyhow = { version = "1", optional = true }
fs2 = { version = "0.4", optional = true }
toml = { version = "0.8", optional = true }
rodio = { version = "0.21", optional = true }
ureq = { version = "3", optional = true, features = ["json"] }

[features]
default = ["streaming"]
streaming = [
    "dep:tokio",
    "dep:flume",
    "dep:rustfft",
    "dep:serde",
    "dep:serde_json",
    "dep:anyhow",
    "dep:fs2",
    "dep:toml",
    "dep:rodio",
    "dep:ureq",
]

# The one, fully-wired binary.
[[bin]]
name = "myx"
path = "src/main.rs"

# Dev tools, kept as examples (cargo run --example theme_demo).
[[example]]
name = "theme_demo"
path = "examples/theme_demo.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.deb]
section = "sound"
priority = "optional"
assets = [
    ["target/release/myx", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/myx/README.md", "644"],
    ["LICENSE", "usr/share/doc/myx/LICENSE", "644"],
    ["NOTICE", "usr/share/doc/myx/NOTICE", "644"],
]
