[package]
name = "smyx"
version = "0.2.7"
edition = "2021"
description = "A lean, beautiful terminal Navidrome / OpenSubsonic player"
authors = ["Ayan Chavand", "Haseeb Khalid"]
license = "MIT"
repository = "https://github.com/ayanchavand/Smyx"
homepage = "https://github.com/ayanchavand/Smyx"
readme = "README.md"
keywords = ["navidrome", "subsonic", "tui", "music", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]
default-run = "smyx"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
image = "0.25"
color-thief = "0.2"

# --- streaming backend (on by default; the single `smyx` binary needs it) ---
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
flume = { version = "0.12", optional = true }
rustfft = { version = "6", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
anyhow = { version = "1", optional = true }
fs2 = { version = "0.4", optional = true }
toml = { version = "0.8", optional = true }
rodio = { version = "0.21", optional = true }
ureq = { version = "3", optional = true, features = ["json"] }

[features]
default = ["streaming"]
streaming = [
    "dep:tokio",
    "dep:flume",
    "dep:rustfft",
    "dep:serde",
    "dep:serde_json",
    "dep:anyhow",
    "dep:fs2",
    "dep:toml",
    "dep:rodio",
    "dep:ureq",
]

# The one, fully-wired binary.
[[bin]]
name = "smyx"
path = "src/main.rs"

# Dev tools, kept as examples (cargo run --example theme_demo).
[[example]]
name = "theme_demo"
path = "examples/theme_demo.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.deb]
section = "sound"
priority = "optional"
assets = [
    ["target/release/smyx", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/smyx/README.md", "644"],
    ["LICENSE", "usr/share/doc/smyx/LICENSE", "644"],
    ["NOTICE", "usr/share/doc/smyx/NOTICE", "644"],
]
