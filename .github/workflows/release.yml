name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build release binary
        run: cargo build --release

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/smyx.exe staging/smyx.exe
          else
            cp target/release/smyx staging/smyx
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smyx-${{ matrix.os }}
          path: staging/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Release Archives
        run: |
          mkdir -p release-assets
          if [ -d "artifacts/smyx-ubuntu-latest" ]; then
            tar -czvf release-assets/smyx-linux.tar.gz -C artifacts/smyx-ubuntu-latest smyx
          fi
          if [ -d "artifacts/smyx-macos-latest" ]; then
            tar -czvf release-assets/smyx-macos.tar.gz -C artifacts/smyx-macos-latest smyx
          fi
          if [ -d "artifacts/smyx-windows-latest" ]; then
            zip -j release-assets/smyx-windows.zip artifacts/smyx-windows-latest/smyx.exe
          fi

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
